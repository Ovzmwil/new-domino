<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link type="text/css" rel="stylesheet" href="css/meucadastro.css">
    <title>Minha Conta - Dominando</title>
</head>
<body>
    
    <div class="row">
        <img src="./assets/TituloJogo.png" class="center" style="width: 150px;" alt="logo" id="main-logo">
        <div class="form" style="border-radius: 10px;">
        <h1> Dados da conta </h1>
            <form class="login-form">
                <input type="text" placeholder="Nome de Usuário" id="txtNomeCad"/>
                <input type="email" placeholder="Endereço de Email" id="txtEmailCad"/>
                <input type="password" placeholder="Senha" id="txtSenhaCad" />
                <input type="password" placeholder="Digite a Senha Novamente" id="txtConfSenhaCad"/>                
                <input type="button" id="btnCadastrar" value="Atualizar Dados"> 
                <input type="button" id="btnCancelar" style="margin-top:3px;" value="Cancelar">             
            </form>
        </div>        
       
    </div>
   
    <script type="text/javascript" src="js/Client/Plugins/jquery.min.js"></script>
    <script type="text/javascript" src="js/Client/cadastro.js"></script>
</body>
</html>
