<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link type="text/css" rel="stylesheet" href="css/login.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Dominando</title>
    <script type="text/javascript" src="js/Client/Plugins/phaser.min.js"></script>

</head>
<body>
    
    <img src="./assets/TituloJogo.png" class="center" alt="logo" id="main-logo">
    <div class="login-page">
        <div class="form" style="border-radius: 10px;">
            <form class="login-form">
                <input type="text" placeholder="Nome de Usuário" id="txtUsername" value="dominando"/>
                <input type="password" placeholder="Senha" id="txtPassword" value="senha"/>

                <input type="button" id="btnLogin" value="Login">                 
                <input type="button" id="btnConta" href="cadastro" style="margin-top:3px;" value="Criar Conta Grátis"> 
            </form>
        </div>
    </div>
    <script type="text/javascript" src="js/Client/Plugins/jquery.min.js"></script>
    <script type="text/javascript" src="js/Client/login.js"></script>
</body>
</html>
